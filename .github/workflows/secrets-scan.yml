name: Secrets Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets Scan
    runs-on: ubuntu-latest   # change to: self-hosted   once your runner is up
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history: finds keys even in old commits

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified
